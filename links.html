<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Parallel — Links</title>
  <meta name="description" content="The Parallel — Coffee & Toast Bar, Perth CBD. Website, Instagram and reviews." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:          #560618;
      --paper-dark:     #3D0410;
      --paper-mid:      #720C22;
      --paper-mid-rgb:  114,12,34;
      --ink:            #FFFFFF;
      --ink-rgb:        255,255,255;
      --muted:          rgba(var(--ink-rgb),0.82);
      --border:         rgba(var(--ink-rgb),0.16);
    }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background: var(--paper);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(var(--paper-mid-rgb),.7) 0%, transparent 70%);
      color: var(--ink);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      display: flex;
      justify-content: center;
      padding: 4.5rem 1.25rem 3rem;
    }
    .wrap { width: 100%; max-width: 420px; text-align: center; }

    .badge {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
      color: var(--ink);
      background: rgba(var(--ink-rgb),.10);
      border: 1px solid rgba(var(--ink-rgb),.3);
      border-radius: 999px;
      padding: .45rem 1.1rem;
      margin-bottom: 1.4rem;
    }

    .wordmark {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.4rem, 11vw, 3.2rem);
      letter-spacing: .01em;
      line-height: 1;
      margin-bottom: .7rem;
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .8rem; letter-spacing: .28em; text-transform: uppercase;
      color: rgba(var(--ink-rgb),.55);
      margin-bottom: .5rem;
    }

    .address {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 2.6rem;
    }

    .links { display: flex; flex-direction: column; gap: .85rem; }

    .link-btn {
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      padding: 1rem 1.4rem;
      border: 1px solid rgba(var(--ink-rgb),.35);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .92rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      transition: border-color .2s, background .2s, transform .15s;
      background: rgba(var(--ink-rgb),.03);
    }
    .link-btn:hover { border-color: var(--ink); background: rgba(var(--ink-rgb),.08); transform: translateY(-1px); }

    .link-btn.primary {
      background: var(--ink); color: var(--paper); border-color: var(--ink);
    }
    .link-btn.primary:hover { opacity: .9; background: var(--ink); }

    .link-btn svg { width: 18px; height: 18px; flex: none; fill: currentColor; }

    footer {
      margin-top: 3rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
      color: rgba(var(--ink-rgb),.4);
    }
  </style>
</head>
